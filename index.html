<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailsFinder Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; }
      /* Match the production frontend font (Space Grotesk) across all Antd primitives */
      body,
      #root,
      .ant-typography,
      .ant-btn,
      .ant-menu,
      .ant-input,
      .ant-select,
      .ant-select-selector,
      .ant-table,
      .ant-modal,
      .ant-modal-content,
      .ant-layout,
      .ant-card,
      .ant-dropdown-menu {
        font-family: "Space Grotesk", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
      }

      /* Light theme variables (matches production frontend) */
      :root[data-theme="light"] {
        --bg: #fbf9f8;
        --panel: #fbf9f8;
        --muted: #5a4042;
        --text: #1b1c1b;
        --primary: #b71d3f;
        --accent: #fc536d;
        --border: rgba(226, 190, 191, 0.3);
      }

      /* Dark theme variables (matches production frontend) */
      :root[data-theme="dark"] {
        --bg: #1b1c1b;
        --panel: #2a2a2a;
        --muted: #e2bebf;
        --text: #fbf9f8;
        --primary: #b71d3f;
        --accent: #fc536d;
        --border: rgba(183, 29, 63, 0.25);
        --sidebar: #121212;
        --sidebar-accent: #1f1f1f;
      }

      html[data-theme="dark"] body {
        background: var(--bg);
        color: var(--text);
      }
      html[data-theme="dark"] .ant-layout,
      html[data-theme="dark"] .ant-card,
      html[data-theme="dark"] .ant-table,
      html[data-theme="dark"] .ant-modal-content,
      html[data-theme="dark"] .ant-dropdown-menu {
        background: var(--panel) !important;
        color: var(--text) !important;
      }
      html[data-theme="dark"] .ant-typography,
      html[data-theme="dark"] .ant-input,
      html[data-theme="dark"] .ant-select-selector,
      html[data-theme="dark"] .ant-btn,
      html[data-theme="dark"] .ant-form-item-label > label {
        color: var(--text) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
