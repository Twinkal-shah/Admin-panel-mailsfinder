<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>MailsFinder Admin</title>

    <!-- Apply the saved theme before first paint. shadcn tokens key off the
         `.dark` CLASS (see @custom-variant in globals.css), not an attribute.
         Same storage key and same default as the ThemeProvider, so an existing
         `theme: 'light'` preference is honoured with no flash. -->
    <script>
      try {
        var saved = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', saved !== 'light');
      } catch (e) {}
    </script>

    <!-- Space Grotesk and Geist Mono are self-hosted via @fontsource-variable
         and imported from globals.css. No third-party font request, so there is
         no render-blocking stylesheet and no swap flash to work around. -->

    <style>
      /* Only the pre-React boot shell lives here. Everything else is a Tailwind
         token in src/styles/globals.css — this file no longer carries a second
         palette or any .ant-* override. The few values below are duplicated
         from the token file by necessity: they must paint before any CSS
         module has loaded. */
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: oklch(0.99 0 0);
      }
      html.dark body {
        background: oklch(0 0 0);
      }

      /* Silhouette of the real shell: inset sidebar with an 8px gutter, a
         rounded content pane and a 64px header. Matching the new geometry means
         a cold load cannot flash a layout that then jumps. */
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        padding: 8px;
        background: oklch(0.99 0 0);
        color: oklch(0 0 0);
      }
      html.dark #boot-shell {
        background: oklch(0.18 0 0);
        color: oklch(1 0 0);
      }
      #boot-shell .bs-side {
        width: 16rem;
        flex: none;
        padding: 8px;
      }
      #boot-shell .bs-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
        background: oklch(1 0 0);
      }
      html.dark #boot-shell .bs-main {
        background: oklch(0 0 0);
      }
      #boot-shell .bs-top {
        height: 64px;
        flex: none;
        border-bottom: 1px solid oklch(0.92 0 0);
      }
      html.dark #boot-shell .bs-top {
        border-bottom-color: oklch(0.26 0 0);
      }
      #boot-shell .bs-brand {
        height: 32px;
        width: 32px;
        border-radius: 8px;
        margin-bottom: 16px;
        background: oklch(0.507 0.186 16.06);
      }
      #boot-shell .bs-bar {
        height: 32px;
        border-radius: 6px;
        margin-bottom: 4px;
        background: currentColor;
        opacity: 0.06;
      }
      @media (max-width: 767px) {
        #boot-shell .bs-side {
          display: none;
        }
        #boot-shell {
          padding: 0;
        }
        #boot-shell .bs-main {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" aria-hidden="true">
        <div class="bs-side">
          <div class="bs-brand"></div>
          <div class="bs-bar"></div>
          <div class="bs-bar"></div>
          <div class="bs-bar"></div>
          <div class="bs-bar"></div>
          <div class="bs-bar"></div>
        </div>
        <div class="bs-main">
          <div class="bs-top"></div>
        </div>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        The MailsFinder admin panel needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
